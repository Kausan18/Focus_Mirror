version: "3.9"

services:

  # ─── MongoDB ──────────────────────────────────────────────────────────────
  mongodb:
    image: mongo:7.0
    container_name: focusmirror-mongodb
    restart: unless-stopped
    env_file: .env
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_DB}
    volumes:
      - mongo_data:/data/db
    networks:
      - focusmirror-net
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Redis ────────────────────────────────────────────────────────────────
  redis:
    image: redis:7.2-alpine
    container_name: focusmirror-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    networks:
      - focusmirror-net
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── FastAPI ──────────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: focusmirror-backend
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./backend:/app          # hot-reload during development
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - focusmirror-net
    # Port 8000 is NOT exposed to host — NGINX is the only entry point

  # ─── NGINX ────────────────────────────────────────────────────────────────
  nginx:
    image: nginx:1.25-alpine
    container_name: focusmirror-nginx
    restart: unless-stopped
    ports:
      - "80:80"                 # only exposed port
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
    networks:
      - focusmirror-net

# ─── Volumes ──────────────────────────────────────────────────────────────
volumes:
  mongo_data:
  redis_data:

# ─── Network ──────────────────────────────────────────────────────────────
networks:
  focusmirror-net:
    driver: bridge